# Desktop compositor: subtle shadows/fades, no blur or general transparency.
# Recreated for Picom 12 using the old desktop preferences as a reference.
backend = "xrender";
vsync = true;

shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.7;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 10;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# Use current window rules, not the superseded shadow-exclude/wintypes syntax.
rules = (
    {
        match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd' || class_g = 'Cairo-clock' || _GTK_FRAME_EXTENTS@";
        shadow = false;
    },
    {
        match = "window_type = 'tooltip'";
        shadow = true;
        opacity = 0.75;
    },
    {
        match = "window_type = 'dock' || window_type = 'desktop' || fullscreen";
        shadow = false;
        corner-radius = 0;
    },
    {
        match = "class_g ?= 'flameshot' || class_g ?= 'xscreensaver'";
        shadow = false;
        fade = false;
    }
);
